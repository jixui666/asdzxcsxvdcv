name: Build WQFiles IPA

# 编译 WQFiles.ipa：纯 swiftc/clang 交叉编译 + ad-hoc 签名，不需要 Apple 证书。
# 产物：artifact（需登录下载）+ release asset（公开直链）。
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    # iOS 26.0 部署目标需要 iOS 26 SDK，只有 macOS 26 镜像带 Xcode 26。
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select Xcode 26 toolchain
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidates=(/Applications/Xcode_26*.app)
          if [ ${#candidates[@]} -eq 0 ]; then candidates=(/Applications/Xcode*.app); fi
          if [ ${#candidates[@]} -gt 0 ]; then
            newest=$(printf '%s\n' "${candidates[@]}" | sort -V | tail -n 1)
            echo "xcode-select -> $newest"
            sudo xcode-select -s "$newest"
          fi
          xcodebuild -version | tee toolchain.log
          echo "iphoneos SDK: $(xcrun --sdk iphoneos --show-sdk-version)" | tee -a toolchain.log
          echo "iphoneos SDK path: $(xcrun --sdk iphoneos --show-sdk-path)" | tee -a toolchain.log
          swift --version | tee -a toolchain.log
          clang --version | tee -a toolchain.log
          python3 --version | tee -a toolchain.log

      - name: Install python deps (cryptography)
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/pyenv"
          "$RUNNER_TEMP/pyenv/bin/python" -m pip install --quiet --upgrade pip
          "$RUNNER_TEMP/pyenv/bin/pip" install --quiet cryptography
          echo "$RUNNER_TEMP/pyenv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/pyenv/bin/python" -c 'import cryptography; print("cryptography", cryptography.__version__)'

      - name: Generate secrets (SecureBox shards)
        env:
          SECRETS_JSON: ${{ secrets.SECRETS_JSON }}
        run: |
          set -euo pipefail
          mkdir -p Generated
          python3 tools/gen_secrets.py 2>&1 | tee -a toolchain.log
          # 21 条常量逐条解回明文比对；SECRETS_JSON 没配好（退回占位）就直接失败，
          # 不让连不上服务器的包走到签名与发布。
          python3 tools/verify_secrets.py --require-real 2>&1 | tee -a toolchain.log
          ls -la Generated/

      - name: Build IPA
        env:
          SECRETS_JSON: ${{ secrets.SECRETS_JSON }}
          WQ_SKIP_PREFLIGHT: "1"
          # 发布构建必须用真配置：占位（secrets.sample.json 回退）直接失败。
          WQFILES_REQUIRE_REAL_SECRETS: "1"
        run: |
          set -euo pipefail
          bash build.sh 2>&1 | tee -a toolchain.log
          ls -la WQFiles.ipa
          unzip -l WQFiles.ipa | head -30

      - name: Verify auto-collect hooks are present
        run: |
          set -e
          APP=$(mktemp -d)
          unzip -q WQFiles.ipa -d "$APP"
          BIN="$APP/Payload/WQFiles.app/WQFiles"
          echo "binary: $(stat -f%z "$BIN") bytes"
          for s in "阶段 1/6" "wqnet_log" "WQCollector" "wq_secret" "wq_secret_aes_material" "wq_secret_v1_key"; do
            if strings "$BIN" | grep -q "$s"; then echo "  OK   $s"; else echo "  MISS $s"; fi
          done

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WQFiles-ipa
          path: WQFiles.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish IPA as release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="ipa-run${{ github.run_number }}"
          notes=$(printf 'Automatic build\n\n- commit: %s\n- runner: macOS 26\n- deployment target: iOS 26.0 (ad-hoc signed)\n' "${{ github.sha }}")
          gh release create "$tag" WQFiles.ipa \
            --repo "${{ github.repository }}" \
            --title "WQFiles IPA ${tag}" \
            --notes "$notes" || {
              gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1 && \
              gh release upload "$tag" WQFiles.ipa --repo "${{ github.repository }}" --clobber
            }
          echo "download: https://github.com/${{ github.repository }}/releases/download/$tag/WQFiles.ipa"

      - name: Publish diagnosis bundle on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          tag="fail-run${{ github.run_number }}"
          {
            echo "job: ${{ github.job }}"
            echo "commit: ${{ github.sha }}"
            echo "runner: $RUNNER_OS $RUNNER_ARCH"
            echo "--- git status ---"
            git status --short || true
            echo "--- Generated ---"
            ls -la Generated 2>/dev/null || true
          } > job-context.txt 2>&1
          touch toolchain.log build.log
          gh release create "$tag" job-context.txt toolchain.log build.log \
            --repo "${{ github.repository }}" \
            --title "CI failure ${tag}" \
            --notes "Diagnostics for run ${{ github.run_number }}" || true

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            *.log
            job-context.txt
            Generated/
