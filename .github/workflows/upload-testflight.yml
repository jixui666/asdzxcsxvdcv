name: Upload to TestFlight

on:
  workflow_dispatch:
    inputs:
      ipa_run:
        description: '从哪个 run 的 release 取 IPA（留空则用最新的 ipa-run*）'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ---------------------------------------------------------------- 1) 取 IPA
      - name: Fetch the unsigned IPA from the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WANT: ${{ inputs.ipa_run }}
        run: |
          set -euo pipefail
          if [ -n "${WANT}" ]; then
            tag="ipa-run${WANT}"
          else
            tag=$(gh release list --repo "${{ github.repository }}" --limit 30 \
                  --json tagName --jq '[.[] | select(.tagName | startswith("ipa-run"))][0].tagName')
          fi
          echo "using release: $tag"
          mkdir -p work
          gh release download "$tag" --repo "${{ github.repository }}" \
             --pattern 'WQFiles.ipa' --dir work
          ls -l work/

      # ---------------------------------------------------------------- 2) 装证书 + profile
      - name: Install distribution certificate and profile
        env:
          P12_B64: ${{ secrets.DIST_P12_BASE64 }}
          P12_PASS: ${{ secrets.DIST_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          # keychain
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASS=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"

          # p12
          echo "$P12_B64" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" \
            -P "$P12_PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          # profile
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_B64" | base64 -d \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/AppStore.mobileprovision"

          echo "--- 证书 ---"
          security find-identity -v -p codesigning "$KEYCHAIN"

          echo "--- profile ---"
          openssl smime -inform der -verify -noverify \
            -in "$HOME/Library/MobileDevice/Provisioning Profiles/AppStore.mobileprovision" 2>/dev/null \
            | plutil -convert xml1 -o - - | grep -A2 -E "Name|application-identifier|get-task-allow" | head -20

      # ---------------------------------------------------------------- 3) 重签
      - name: Re-sign with the App Store identity
        run: |
          set -euo pipefail
          cd work
          rm -rf Payload
          unzip -q WQFiles.ipa

          APP="Payload/JSQ2.app"
          [ -d "$APP" ] || { echo "ERROR: $APP missing"; ls -R Payload | head -30; exit 1; }

          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain-db" \
                     | awk -F'"' '/Apple Distribution/{print $2; exit}')
          [ -n "$IDENTITY" ] || { echo "ERROR: no Apple Distribution identity"; exit 1; }
          echo "identity: $IDENTITY"

          PROFILE="$HOME/Library/MobileDevice/Provisioning Profiles/AppStore.mobileprovision"
          cp "$PROFILE" "$APP/embedded.mobileprovision"

          # 用 profile 里的 entitlements 重签（App Store profile 的 entitlements 必须逐字匹配）
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          plutil -extract Entitlements xml1 -o "$RUNNER_TEMP/ent.plist" "$RUNNER_TEMP/profile.plist"

          codesign -f -s "$IDENTITY" --entitlements "$RUNNER_TEMP/ent.plist" \
                   --timestamp --options runtime "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | head -12

          rm -f AppStore.ipa
          zip -qr AppStore.ipa Payload
          ls -lh AppStore.ipa

      # ---------------------------------------------------------------- 4) 上传
      - name: Upload to App Store Connect
        env:
          ASC_KEY_B64: ${{ secrets.ASC_KEY_B64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$ASC_KEY_B64" | base64 -d \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          xcrun altool --upload-app \
            --type ios \
            --file work/AppStore.ipa \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --verbose 2>&1 | tee upload.log

      # ---------------------------------------------------------------- 5) 保留签名后的包
      - name: Keep the signed IPA
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: AppStore-signed-ipa
          path: work/AppStore.ipa
          if-no-files-found: warn
          retention-days: 7

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: upload-log
          path: upload.log
          if-no-files-found: ignore
